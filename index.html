<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amperion | Serviços Elétricos e Manutenção</title>
  
  <!-- SEO e Meta Tags -->
  <meta name="description" content="Amperion Serviços Elétricos e Manutenção. Atendimento residencial, predial e comercial por Matheus Saggiorato.">
  <meta property="og:title" content="Amperion Serviços Elétricos e Manutenção">
  <meta property="og:description" content="Site em desenvolvimento. Entre em contato diretamente pelo WhatsApp para orçamentos e atendimentos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://amperioneletrica.com.br">

  <!-- Prevenção de Cache -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">

  <style>
    :root {
      --primary-orange: #ff5500;
      --bg-gradient-start: #1f242a;
      --bg-gradient-end: #060f19;
      --text-white: #ffffff;
      --text-muted: #a0aec0;
      --card-border: rgba(255, 85, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 0% 0%, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-container {
      width: 100%;
      max-width: 500px;
      background-color: rgba(6, 15, 25, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }

    /* Marca / Logotipo */
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      max-width: 160px;
      width: 100%;
      height: auto;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(255, 85, 0, 0.15));
    }

    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-orange);
      letter-spacing: 3px;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: 1.5px;
      margin-top: 6px;
    }

    /* Divisor */
    .divider {
      border: none;
      height: 2px;
      background-color: var(--primary-orange);
      margin: 24px 0;
    }

    /* Informações do Profissional */
    .engineer-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-white);
      margin-bottom: 16px;
    }

    .engineer-name .role {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Status Badge com Animação */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(255, 85, 0, 0.1);
      border: 1px solid rgba(255, 85, 0, 0.3);
      color: var(--primary-orange);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary-orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary-orange);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    /* Botões de Ação */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-whatsapp {
      background-color: var(--primary-orange);
      color: var(--text-white);
      border: 1px solid var(--primary-orange);
    }

    .btn-whatsapp:hover {
      background-color: #e04b00;
      border-color: #e04b00;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Rodapé */
    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

      <h1 class="brand-title">AMPERION</h1>
      <p class="brand-subtitle">SERVIÇOS ELÉTRICOS E MANUTENÇÃO</p>

    <section class="info-section">

      <div class="status-badge">

        </a>
      </div>
    </section>

    <footer>
      <p>www.amperioneletrica.com.br</p>
    </footer>
  </main>

</body>
</html>
